<svg width="100%" viewBox="0 0 1000 632" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Translation pipeline: services and prompt variants</title>
<desc>Methods diagram: a source term and target language code feed into two parallel tracks — direct services (Google Translate, EasyNMT, Lingvanex, Wikipedia) and LLM services (8 models × 3 prompt variants). All outputs are deduplicated and passed to a judge variant that synthesises the best translation.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="rgb(120,116,106)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="rgb(105,60,165)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  svg { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .mono { font-family: "SF Mono", "Fira Mono", "Consolas", monospace; font-size: 10px; }
</style>

<!-- ── Figure title ──────────────────────────────────────────────────── -->
<text x="40" y="30" style="font-size:14px;font-weight:600;fill:rgb(20,20,19);">Translation Pipeline: Services and Prompt Variants</text>
<text x="40" y="48" style="font-size:11px;fill:rgb(90,88,82);">Applied per source term × target language code pair; 880 language codes total</text>

<!-- ── Input box ─────────────────────────────────────────────────────── -->
<rect x="280" y="62" width="440" height="44" rx="8" style="fill:rgb(245,243,236);stroke:rgb(150,146,130);stroke-width:0.75px;"/>
<text x="500" y="80" text-anchor="middle" dominant-baseline="central" style="font-size:12px;font-weight:600;fill:rgb(50,48,40);">Source term (e.g. "Digital Humanities")</text>
<text x="500" y="96" text-anchor="middle" dominant-baseline="central" style="font-size:10px;fill:rgb(110,106,94);">translated into each of 880 target language codes (ISO 639-1/2/3)</text>

<!-- Fork arrows: input → two tracks -->
<line x1="500" y1="106" x2="500" y2="118" style="stroke:rgb(120,116,106);stroke-width:1.2px;"/>
<line x1="170" y1="118" x2="660" y2="118" style="stroke:rgb(120,116,106);stroke-width:1.2px;"/>
<line x1="170" y1="118" x2="170" y2="128" marker-end="url(#arr)" style="stroke:rgb(120,116,106);stroke-width:1.2px;"/>
<line x1="660" y1="118" x2="660" y2="128" marker-end="url(#arr)" style="stroke:rgb(120,116,106);stroke-width:1.2px;"/>

<!-- ════════════════════════════════════════════════════════════════════ -->
<!-- LEFT COLUMN: Direct Services   x=40  y=128  w=260  h=266          -->
<!-- ════════════════════════════════════════════════════════════════════ -->
<rect x="40" y="128" width="260" height="266" rx="8" style="fill:rgb(215,243,250);stroke:rgb(0,164,196);stroke-width:1px;"/>

<text x="170" y="148" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:700;fill:rgb(0,74,90);">Direct Services</text>
<text x="170" y="163" text-anchor="middle" dominant-baseline="central" style="font-size:10px;fill:rgb(0,130,160);">prompt-invariant · 4 services</text>
<line x1="52" y1="171" x2="288" y2="171" style="stroke:rgb(0,164,196);stroke-width:0.5px;"/>

<text x="58" y="188" dominant-baseline="central" style="font-size:11px;fill:rgb(0,74,90);">●  Google Translate</text>
<text x="58" y="205" dominant-baseline="central" style="font-size:11px;fill:rgb(0,74,90);">●  EasyNMT (Helsinki-NLP)</text>
<text x="58" y="222" dominant-baseline="central" style="font-size:11px;fill:rgb(0,74,90);">●  Lingvanex</text>
<text x="58" y="239" dominant-baseline="central" style="font-size:11px;fill:rgb(0,74,90);">●  Wikipedia title lookup</text>

<line x1="52" y1="251" x2="288" y2="251" style="stroke:rgb(0,164,196);stroke-width:0.5px;stroke-dasharray:3 3;opacity:0.6;"/>

<text x="58" y="265" dominant-baseline="central" style="font-size:10px;fill:rgb(0,100,130);">Each service queried once per</text>
<text x="58" y="279" dominant-baseline="central" style="font-size:10px;fill:rgb(0,100,130);">language code. No prompt</text>
<text x="58" y="293" dominant-baseline="central" style="font-size:10px;fill:rgb(0,100,130);">engineering applied.</text>
<text x="58" y="311" dominant-baseline="central" style="font-size:10px;font-weight:700;fill:rgb(0,120,155);">→ 4 outputs per language</text>
<text x="58" y="327" dominant-baseline="central" style="font-size:10px;fill:rgb(0,100,130);">Results cached after first run</text>
<text x="58" y="341" dominant-baseline="central" style="font-size:10px;fill:rgb(0,100,130);">and reused across LLM variants.</text>
<text x="58" y="359" dominant-baseline="central" style="font-size:10px;fill:rgb(0,100,130);">Output: {service}_translated_term</text>
<text x="58" y="373" dominant-baseline="central" style="font-size:10px;fill:rgb(0,100,130);">→ direct_services/{term}/</text>

<!-- ════════════════════════════════════════════════════════════════════ -->
<!-- RIGHT COLUMN: LLM Services   x=320  y=128  w=640  h=266           -->
<!-- ════════════════════════════════════════════════════════════════════ -->
<rect x="320" y="128" width="640" height="266" rx="8" style="fill:rgb(252,226,240);stroke:rgb(190,30,106);stroke-width:1px;"/>

<text x="640" y="148" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:700;fill:rgb(120,0,65);">LLM Services × Prompt Variants</text>
<text x="640" y="163" text-anchor="middle" dominant-baseline="central" style="font-size:10px;fill:rgb(190,30,106);">8 models × 3 variants = 24 LLM outputs per language code</text>
<line x1="332" y1="171" x2="948" y2="171" style="stroke:rgb(190,30,106);stroke-width:0.5px;"/>

<!-- models band -->
<rect x="330" y="174" width="622" height="40" rx="5" style="fill:rgb(255,245,250);stroke:rgb(220,140,180);stroke-width:0.5px;"/>
<text x="340" y="188" dominant-baseline="central" style="font-size:10px;font-weight:700;fill:rgb(80,20,50);">Cloud:</text>
<text x="384" y="188" dominant-baseline="central" style="font-size:10px;fill:rgb(130,40,85);">GPT-4o  ·  Claude Sonnet 4.5  ·  Gemini 2.5 Flash  ·  DeepSeek V3</text>
<text x="340" y="204" dominant-baseline="central" style="font-size:10px;font-weight:700;fill:rgb(80,20,50);">Local:</text>
<text x="384" y="204" dominant-baseline="central" style="font-size:10px;fill:rgb(130,40,85);">Llama 3.1  ·  Gemma 3 (12B)  ·  Qwen 2.5 (7B)  ·  Mistral 7B  — via Ollama</text>

<!-- ── Variant 1: Minimal   y=218–274 ────────────────────────────────── -->
<rect x="330" y="218" width="622" height="56" rx="5" style="fill:rgb(255,251,244);stroke:rgb(190,160,100);stroke-width:0.75px;"/>
<text x="340" y="232" dominant-baseline="central" style="font-size:11px;font-weight:700;fill:rgb(80,58,10);">1 · Minimal</text>
<text x="430" y="232" dominant-baseline="central" style="font-size:10px;fill:rgb(120,90,20);">bare instruction, no system prompt (baseline comparison)</text>
<text x="340" y="248" dominant-baseline="central" class="mono" style="fill:rgb(90,68,10);">Translate '{term}' into {language} (ISO {code}).</text>
<text x="340" y="263" dominant-baseline="central" class="mono" style="fill:rgb(90,68,10);">Reply in JSON: {"translated_term": "...", "translation_rationale": "..."}</text>

<!-- ── Variant 2: Expert Persona   y=278–334 ─────────────────────────── -->
<rect x="330" y="278" width="622" height="56" rx="5" style="fill:rgb(250,242,254);stroke:rgb(160,100,200);stroke-width:0.75px;"/>
<text x="340" y="292" dominant-baseline="central" style="font-size:11px;font-weight:700;fill:rgb(58,14,100);">2 · Expert Persona</text>
<text x="488" y="292" dominant-baseline="central" style="font-size:10px;fill:rgb(100,40,150);">domain expert + native speaker role; scholarly accuracy &amp; cultural equivalence</text>
<text x="340" y="308" dominant-baseline="central" class="mono" style="fill:rgb(70,20,120);">You are an expert {term} scholar and native {language} speaker...</text>
<text x="340" y="323" dominant-baseline="central" class="mono" style="fill:rgb(100,55,155);">sys: "You are a {term} scholar who speaks many languages."</text>

<!-- ── Variant 3: Native Rationale   y=338–394 ───────────────────────── -->
<rect x="330" y="338" width="622" height="56" rx="5" style="fill:rgb(240,228,254);stroke:rgb(120,60,180);stroke-width:0.75px;"/>
<text x="340" y="352" dominant-baseline="central" style="font-size:11px;font-weight:700;fill:rgb(38,8,90);">3 · Native Rationale</text>
<text x="494" y="352" dominant-baseline="central" style="font-size:10px;fill:rgb(80,30,140);">rationale written in the target language (tests deeper linguistic grounding)</text>
<text x="340" y="368" dominant-baseline="central" class="mono" style="fill:rgb(55,15,110);">Please provide your rationale in {language}, not English...</text>
<text x="340" y="383" dominant-baseline="central" class="mono" style="fill:rgb(95,50,155);">sys: "You are a {term} scholar who speaks many languages."</text>

<!-- ════════════════════════════════════════════════════════════════════ -->
<!-- Merge arrows → Judge                                                -->
<!-- ════════════════════════════════════════════════════════════════════ -->
<line x1="170" y1="394" x2="170" y2="416" style="stroke:rgb(0,164,196);stroke-width:1.2px;"/>
<line x1="660" y1="394" x2="660" y2="416" style="stroke:rgb(190,30,106);stroke-width:1.2px;"/>
<line x1="170" y1="416" x2="478" y2="432" style="stroke:rgb(105,60,165);stroke-width:1.2px;"/>
<line x1="660" y1="416" x2="522" y2="432" style="stroke:rgb(105,60,165);stroke-width:1.2px;"/>
<line x1="500" y1="432" x2="500" y2="444" marker-end="url(#arrP)" style="stroke:rgb(105,60,165);stroke-width:1.2px;"/>

<text x="74" y="408" style="font-size:10px;fill:rgb(0,140,170);">→ 4 outputs</text>
<text x="662" y="408" style="font-size:10px;fill:rgb(190,30,106);">→ 24 outputs</text>
<text x="500" y="443" text-anchor="middle" style="font-size:10px;fill:rgb(105,60,165);">unique translations deduplicated by value across all 28 sources; sorted by consensus</text>

<!-- ════════════════════════════════════════════════════════════════════ -->
<!-- Judge box   x=100  y=452  w=800  h=88                             -->
<!-- ════════════════════════════════════════════════════════════════════ -->
<rect x="100" y="452" width="800" height="88" rx="8" style="fill:rgb(237,224,248);stroke:rgb(120,60,180);stroke-width:1px;"/>

<text x="500" y="470" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:700;fill:rgb(52,16,110);">4 · Judge (synthesis)</text>
<text x="500" y="485" text-anchor="middle" dominant-baseline="central" style="font-size:10px;fill:rgb(100,60,165);">runs last; requires all prior variants on disk</text>
<line x1="114" y1="492" x2="886" y2="492" style="stroke:rgb(160,100,220);stroke-width:0.5px;"/>

<text x="116" y="505" dominant-baseline="central" style="font-size:11px;fill:rgb(52,16,110);">Receives all unique translations from all 28 sources, grouped by identical value (consensus first).</text>
<text x="116" y="521" dominant-baseline="central" style="font-size:11px;fill:rgb(52,16,110);">Selects the best translation or generates an improved one; rationale logged alongside choice.</text>
<text x="116" y="534" dominant-baseline="central" class="mono" style="fill:rgb(95,50,160);">sys: "You are a {term} scholar."  ·  reply: {"translated_term": "...", "translation_rationale": "..."}</text>

<!-- Arrow judge → output -->
<line x1="500" y1="540" x2="500" y2="556" marker-end="url(#arr)" style="stroke:rgb(120,116,106);stroke-width:1.2px;"/>

<!-- ════════════════════════════════════════════════════════════════════ -->
<!-- Output box   x=100  y=556  w=800  h=56                            -->
<!-- ════════════════════════════════════════════════════════════════════ -->
<rect x="100" y="556" width="800" height="56" rx="8" style="fill:rgb(245,243,236);stroke:rgb(150,146,130);stroke-width:0.75px;"/>
<text x="500" y="574" text-anchor="middle" dominant-baseline="central" style="font-size:12px;font-weight:600;fill:rgb(50,48,40);">Output per language code</text>
<text x="500" y="590" text-anchor="middle" dominant-baseline="central" class="mono" style="fill:rgb(90,86,74);">{service}_translated_term  ·  {service}_translation_rationale (JSON)  ·  saved to prompt_services/ or direct_services/</text>

<!-- Footer note -->
<text x="40" y="625" style="font-size:10px;fill:rgb(130,126,110);">† Per term: 4 direct + 8 LLMs × 3 variants = 28 translation candidates per language, before deduplication by value.</text>

</svg>
