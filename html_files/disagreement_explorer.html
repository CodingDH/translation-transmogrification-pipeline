<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translation or Transmogrification Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

  :root {
    --bg:      #f8f5ff;
    --surface: #ffffff;
    --surface2:#f0ebff;
    --border:  #d4c5f0;
    --text:    #1a0f33;
    --muted:   #7055a0;
    --accent:  #e0006a;   /* hot pink — primary interactive */
    --accent2: #8b00d4;   /* electric purple */
    --accent3: #0099bb;   /* deep cyan */
    --TRANSMOGRIFICATION:    #e0006a;
    --STRUCTURAL_ABSENCE:    #c07000;
    --PRODUCTIVE_DISAGREEMENT: #007a50;
    --MEASUREMENT_ARTEFACT:  #6b30cc;
    --NOT_APPLICABLE:        #6655aa;
    --CONSENSUS:             #007a9e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, #d4c5f018 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, #d4c5f010 40px);
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #fff0f6 0%, #f5e8ff 100%);
    border-bottom: 2px solid var(--accent);
    box-shadow: 0 2px 12px #e0006a20;
    padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100;
  }
  header h1 {
    font-size: 18px; font-weight: 700; white-space: nowrap;
    background: linear-gradient(90deg, #e0006a, #8b00d4, #0099bb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    text-shadow: none;
  }
  .header-stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 3px 12px; font-size: 12px; color: var(--muted); }
  .stat-pill span { color: var(--text); font-weight: 600; }

  /* ── Controls bar ── */
  #controls { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  #controls label { font-size: 12px; color: var(--muted); }
  #controls input[type=file] { display: none; }
  .btn {
    background: linear-gradient(135deg, #e0006a, #8b00d4);
    color: #fff; border: none; border-radius: 6px; padding: 7px 14px;
    font-size: 13px; cursor: pointer; font-weight: 600;
    transition: opacity .15s, box-shadow .15s;
    box-shadow: 0 2px 8px #e0006a30;
  }
  .btn:hover { opacity: .9; box-shadow: 0 4px 14px #e0006a50; }
  .btn-ghost {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .btn-ghost:hover { border-color: var(--accent2); color: var(--accent2); box-shadow: 0 2px 8px #8b00d420; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  #search-input {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 6px 12px; font-size: 13px; width: 220px;
  }
  #search-input:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px #8b00d415; }
  select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent2); }
  .sep { width: 1px; height: 28px; background: var(--border); }

  /* ── Top-N selector ── */
  .topn-group { display: flex; align-items: center; gap: 6px; }
  .topn-group label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #topn-input {
    width: 64px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 6px 8px; font-size: 13px; text-align: center;
  }

  /* ── Progress bar ── */
  #progress-bar { height: 3px; background: var(--border); }
  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #e0006a, #8b00d4, #0099bb);
    transition: width .3s;
  }

  /* ── Layout ── */
  #app { display: flex; height: calc(100vh - 116px); overflow: hidden; }
  #sidebar { width: 260px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface); }
  #main { flex: 1; overflow-y: auto; padding: 20px 24px; }

  /* ── Sidebar nav ── */
  .sidebar-header {
    padding: 12px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .08em; color: var(--accent2); border-bottom: 1px solid var(--border);
  }
  .nav-item { padding: 9px 16px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; transition: background .1s; }
  .nav-item:hover { background: var(--surface2); }
  .nav-item.active { background: #fff0f8; border-left: 3px solid var(--accent); padding-left: 13px; }
  .nav-lang { font-weight: 600; font-size: 13px; }
  .nav-code { font-size: 11px; color: var(--muted); background: var(--bg); padding: 1px 5px; border-radius: 4px; font-family: monospace; }
  .nav-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; margin-left: auto; flex-shrink: 0; }
  .nav-check { font-size: 13px; color: var(--accent); margin-left: 4px; }
  .nav-divider {
    padding: 4px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .1em; color: var(--accent3); background: var(--surface2);
    border-bottom: 1px solid var(--border); border-top: 1px solid var(--border);
  }

  /* ── Category colors ── */
  .cat-TRANSMOGRIFICATION    { background: #fff0f5; color: var(--TRANSMOGRIFICATION); border: 1px solid #e0006a40; }
  .cat-STRUCTURAL_ABSENCE    { background: #fff8ee; color: var(--STRUCTURAL_ABSENCE); border: 1px solid #c0700040; }
  .cat-PRODUCTIVE_DISAGREEMENT { background: #edfaf4; color: var(--PRODUCTIVE_DISAGREEMENT); border: 1px solid #007a5040; }
  .cat-MEASUREMENT_ARTEFACT  { background: #f5f0ff; color: var(--MEASUREMENT_ARTEFACT); border: 1px solid #6b30cc40; }
  .cat-NOT_APPLICABLE        { background: #f3f0fa; color: var(--NOT_APPLICABLE); border: 1px solid #6655aa40; }
  .cat-CONSENSUS             { background: #e8f8fc; color: var(--CONSENSUS); border: 1px solid #007a9e40; }

  /* ── Card ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .card-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .lang-title { font-size: 22px; font-weight: 700; color: var(--text); }
  .lang-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .category-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
  .card-section { margin-bottom: 16px; }
  .section-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
    color: var(--accent3); margin-bottom: 8px;
  }

  /* ── Stats row ── */
  .stats-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; min-width: 110px; }
  .stat-box .val { font-size: 20px; font-weight: 700; color: var(--text); }
  .stat-box .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ── Evidence ── */
  .evidence-text { background: var(--surface2); border-left: 3px solid var(--accent2); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 12px; color: var(--muted); }

  /* ── Signals ── */
  .signal-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .signal-pill { font-size: 11px; padding: 3px 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); }
  .signal-pill.loan       { border-color: #e0006a55; color: var(--TRANSMOGRIFICATION); background: #fff0f5; }
  .signal-pill.absence    { border-color: #c0700055; color: var(--STRUCTURAL_ABSENCE); background: #fff8ee; }
  .signal-pill.construction { border-color: #8b00d455; color: var(--accent2); background: #f8f0ff; }
  .signal-pill.debate     { border-color: #007a5055; color: var(--PRODUCTIVE_DISAGREEMENT); background: #edfaf4; }
  .signal-pill.script     { border-color: #0099bb55; color: var(--accent3); background: #e8f8fc; }

  /* ── Cluster panel ── */
  .cluster-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .cluster-panel-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .cluster-row { display: grid; grid-template-columns: 10px 1fr auto auto 20px; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background .12s; border-left: 3px solid transparent; }
  .cluster-row:last-child { border-bottom: none; }
  .cluster-row:hover { background: var(--surface2); }
  .cluster-row.selected { background: color-mix(in srgb, var(--cl-bg) 80%, var(--surface)); border-left-color: var(--cl-color); }
  .cluster-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .cluster-term { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-word; }
  .cluster-row.selected .cluster-term { color: var(--cl-color); }
  .cluster-bar-wrap { width: 120px; background: var(--border); border-radius: 3px; height: 5px; flex-shrink: 0; }
  .cluster-bar { height: 5px; border-radius: 3px; }
  .cluster-count { font-size: 11px; color: var(--muted); white-space: nowrap; font-family: monospace; }
  .cluster-check { font-size: 14px; font-weight: 700; color: var(--cl-color); text-align: center; }

  /* ── Baseline terms strip ── */
  .baseline-strip { display: flex; gap: 10px; flex-wrap: wrap; }
  .baseline-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; flex: 1 1 160px; }
  .baseline-svc { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--accent3); margin-bottom: 4px; }
  .baseline-term { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-word; }
  .baseline-empty { font-style: italic; opacity: .45; font-size: 13px; }

  /* ── Script tag ── */
  .script-tag { font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: #e8f8fc; color: var(--accent3); border: 1px solid #0099bb44; text-transform: none; letter-spacing: 0; }

  /* ── Rationale matrix ── */
  .rat-matrix-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  .rat-matrix { border-collapse: collapse; width: 100%; min-width: 700px; }
  .rat-matrix th { background: var(--surface2); color: var(--accent2); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 8px 12px; border: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 2; }
  .rat-matrix th.row-header { position: sticky; left: 0; z-index: 3; background: var(--surface2); min-width: 120px; }
  .rat-matrix td { border: 1px solid var(--border); padding: 0; vertical-align: top; }
  .rat-matrix td.row-header { background: var(--surface2); padding: 10px 12px; font-size: 11px; font-weight: 700; color: var(--accent2); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; position: sticky; left: 0; z-index: 1; }
  .rat-cell { height: 160px; overflow-y: auto; padding: 10px 12px; font-size: 12px; color: var(--text); line-height: 1.6; background: var(--surface); cursor: pointer; transition: background .1s, border-left .1s; border-left: 3px solid transparent; }
  .rat-cell:hover { background: var(--surface2); }
  .rat-cell.expanded { height: auto; min-height: 160px; }
  .rat-cell.cluster-selected { border-left-color: var(--cell-color, var(--accent)); background: color-mix(in srgb, var(--cell-bg, #fff0f5) 60%, var(--surface)); }
  .rat-cell.empty { color: var(--muted); font-style: italic; opacity: .45; cursor: default; }
  .rat-term { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--border); word-break: break-word; }
  .rat-rationale { font-size: 11px; color: var(--muted); line-height: 1.55; }
  .rat-md p { margin: 0 0 6px; }
  .rat-md p:last-child { margin-bottom: 0; }
  .rat-md ul, .rat-md ol { padding-left: 16px; margin: 4px 0 6px; }
  .rat-md li { margin-bottom: 3px; }
  .rat-md strong { font-weight: 700; color: var(--text); }
  .rat-md em { font-style: italic; }
  .rat-md code { background: var(--surface2); border-radius: 3px; padding: 1px 4px; font-family: monospace; font-size: 10px; }
  .rat-expand-hint { display: block; font-size: 10px; color: var(--accent2); margin-top: 6px; opacity: .7; }
  .rat-cell.expanded .rat-expand-hint { display: none; }

  /* ── Notes ── */
  .notes-textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 13px; resize: vertical; min-height: 80px; font-family: inherit; }
  .notes-textarea:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px #8b00d415; }

  /* ── Action row ── */
  .action-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .selected-count { font-size: 12px; color: var(--muted); }

  /* ── Empty state ── */
  #empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; color: var(--muted); text-align: center; }
  #empty-state h2 { font-size: 20px; color: var(--text); }
  #empty-state p { max-width: 380px; line-height: 1.7; }
  .upload-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 32px 48px; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
  .upload-zone:hover { border-color: var(--accent); box-shadow: 0 4px 20px #e0006a18; }

  /* ── Scrollbars ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }

  /* ── Export modal ── */
  #export-overlay { display: none; position: fixed; inset: 0; background: #1a0f3344; z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  #export-overlay.open { display: flex; }
  #export-modal { background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 28px 32px; width: 480px; max-width: 90vw; box-shadow: 0 8px 32px #e0006a20; }
  #export-modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--accent); }
  .export-preview { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 12px; color: var(--muted); max-height: 200px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
  .export-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }

  /* ── Confidence bar ── */
  .conf-bar-wrap { background: var(--border); border-radius: 4px; height: 6px; overflow: hidden; margin-top: 4px; }
  .conf-bar { height: 100%; border-radius: 4px; }

  @media (max-width: 700px) {
    #sidebar { display: none; }
    #app { flex-direction: column; }
    #main { padding: 12px; }
  }
</style>
</head>
<body>

<header>
  <h1>Translation or Transmogrification Explorer</h1>
  <div class="header-stats" id="header-stats"></div>
  <div style="margin-left:auto;display:flex;gap:8px;">
    <label for="file-input" class="btn btn-ghost" style="cursor:pointer;">Load CSV</label>
    <input type="file" id="file-input" accept=".csv">
    <button class="btn btn-ghost" onclick="openExportModal()">Export Selected</button>
  </div>
</header>

<div id="controls">
  <input type="text" id="search-input" placeholder="Search language, code, family…" oninput="applyFilters()">
  <select id="cat-filter" onchange="applyFilters()">
    <option value="">All categories</option>
    <option value="TRANSMOGRIFICATION">Transmogrification</option>
    <option value="STRUCTURAL_ABSENCE">Structural Absence</option>
    <option value="PRODUCTIVE_DISAGREEMENT">Productive Disagreement</option>
    <option value="MEASUREMENT_ARTEFACT">Measurement Artefact</option>
    <option value="NOT_APPLICABLE">Not Applicable</option>
  </select>
  <select id="sort-select" onchange="applyFilters()">
    <option value="default">Sort: Most Disagreement</option>
    <option value="conf_asc">Sort: Lowest Confidence</option>
    <option value="conf_desc">Sort: Highest Confidence</option>
    <option value="alpha">Sort: A–Z</option>
    <option value="selected">Sort: Selected First</option>
  </select>
  <div class="sep"></div>
  <div class="topn-group">
    <label>Select top</label>
    <input type="number" id="topn-input" value="5" min="1" max="269">
    <button class="btn btn-ghost btn-sm" onclick="selectTopN()">Go</button>
    <button class="btn btn-ghost btn-sm" onclick="clearAll()">Clear all</button>
  </div>
  <div style="margin-left:auto;font-size:12px;color:var(--muted);" id="filter-count"></div>
</div>

<div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

<div id="app">
  <div id="sidebar">
    <div class="sidebar-header">Languages</div>
    <div id="nav-list"></div>
  </div>
  <div id="main">
    <div id="empty-state">
      <div class="upload-zone" onclick="document.getElementById('file-input').click()">
        <h2>Load a CSV to begin</h2>
        <p>Click here or use the "Load CSV" button above to load <code>disagreement_explorer_data.csv</code>.</p>
      </div>
    </div>
    <div id="card-container" style="display:none;"></div>
  </div>
</div>

<!-- Export modal -->
<div id="export-overlay">
  <div id="export-modal">
    <h3>Export Selected Terms</h3>
    <p style="color:var(--muted);font-size:12px;margin-bottom:12px;">
      <span id="export-count">0</span> languages with selections will be exported.
      For each, the checked translation candidates are included.
    </p>
    <div class="export-preview" id="export-preview"></div>
    <div class="export-actions">
      <button class="btn btn-ghost" onclick="closeExportModal()">Cancel</button>
      <button class="btn" onclick="downloadExport()">Download CSV</button>
    </div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let allData = [];
let filteredData = [];
let currentIdx = 0;  // index into filteredData
let selections = {};   // { language_code: Set<term> }
let notes = {};        // { language_code: string }

const CAT_LABELS = {
  TRANSMOGRIFICATION: 'Transmogrification',
  STRUCTURAL_ABSENCE: 'Structural Absence',
  PRODUCTIVE_DISAGREEMENT: 'Productive Disagreement',
  MEASUREMENT_ARTEFACT: 'Measurement Artefact',
  NOT_APPLICABLE: 'Not Applicable',
  CONSENSUS: 'Consensus',
};

const CAT_ORDER = {
  TRANSMOGRIFICATION: 0,
  STRUCTURAL_ABSENCE: 1,
  PRODUCTIVE_DISAGREEMENT: 2,
  MEASUREMENT_ARTEFACT: 3,
  NOT_APPLICABLE: 4,
  CONSENSUS: 5,
};

const SERVICES = [
  { key: 'gt_term',                   label: 'Google Translate' },
  { key: 'wikipedia_translated_term', label: 'Wikipedia' },
  { key: 'openai_term',               label: 'OpenAI' },
  { key: 'claude_term',               label: 'Claude' },
  { key: 'gemini_term',               label: 'Gemini' },
  { key: 'ollama_term',               label: 'Ollama' },
];

const VARIANTS = [
  { key: 'minimal',          label: 'Minimal' },
  { key: 'expert_persona',   label: 'Expert Persona' },
  { key: 'native_rationale', label: 'Native Rationale' },
  { key: 'judge',            label: 'Judge' },
];

const RAT_SERVICES = [
  { key: 'claude',  label: 'Claude' },
  { key: 'openai',  label: 'OpenAI' },
  { key: 'gemini',  label: 'Gemini' },
  { key: 'ollama',  label: 'Ollama' },
];

// ── Storage helpers ───────────────────────────────────────────────────────────
const LS_KEY = 'disagr_explorer_v1';

function saveState() {
  const serialized = {
    notes,
    selections: Object.fromEntries(
      Object.entries(selections).map(([k, v]) => [k, [...v]])
    ),
  };
  try { localStorage.setItem(LS_KEY, JSON.stringify(serialized)); } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    notes = s.notes || {};
    selections = Object.fromEntries(
      Object.entries(s.selections || {}).map(([k, v]) => [k, new Set(v)])
    );
  } catch(e) {}
}

// ── CSV loading ───────────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete(results) {
      allData = results.data;
      loadState();
      buildHeaderStats();
      applyFilters();
      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('card-container').style.display = '';
      if (filteredData.length > 0) showCard(0);
    }
  });
});

// ── Header stats ──────────────────────────────────────────────────────────────
function buildHeaderStats() {
  const cats = {};
  allData.forEach(r => { cats[r.category] = (cats[r.category]||0)+1; });
  const totalSel = Object.values(selections).filter(s => s.size > 0).length;
  let html = `<div class="stat-pill">Total: <span>${allData.length}</span></div>`;
  for (const [cat, n] of Object.entries(cats).sort((a,b) => (CAT_ORDER[a[0]]??9)-(CAT_ORDER[b[0]]??9))) {
    html += `<div class="stat-pill" style="border-color:var(--${cat},var(--border));">${CAT_LABELS[cat]||cat}: <span>${n}</span></div>`;
  }
  html += `<div class="stat-pill" id="sel-stat">Selected: <span id="sel-count">${totalSel}</span></div>`;
  document.getElementById('header-stats').innerHTML = html;
}

function updateSelStat() {
  const totalSel = Object.values(selections).filter(s => s && s.size > 0).length;
  const el = document.getElementById('sel-count');
  if (el) el.textContent = totalSel;
}

// ── Filter + sort ─────────────────────────────────────────────────────────────
function applyFilters() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  const cat = document.getElementById('cat-filter').value;
  const sort = document.getElementById('sort-select').value;

  let data = allData.filter(r => {
    if (cat && r.category !== cat) return false;
    if (q) {
      const haystack = `${r.language_name||''} ${r.language_code||''} ${r.language_family||''} ${r.term_source||''}`.toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  if (sort === 'default') {
    data = data.slice().sort((a,b) => {
      const co = (CAT_ORDER[a.category]??9) - (CAT_ORDER[b.category]??9);
      if (co !== 0) return co;
      return (parseFloat(b.n_unique_raw)||0) - (parseFloat(a.n_unique_raw)||0);
    });
  } else if (sort === 'conf_asc') {
    data = data.slice().sort((a,b) => (parseFloat(a.mean_llm_confidence)||0) - (parseFloat(b.mean_llm_confidence)||0));
  } else if (sort === 'conf_desc') {
    data = data.slice().sort((a,b) => (parseFloat(b.mean_llm_confidence)||0) - (parseFloat(a.mean_llm_confidence)||0));
  } else if (sort === 'alpha') {
    data = data.slice().sort((a,b) => (a.language_name||'').localeCompare(b.language_name||''));
  } else if (sort === 'selected') {
    data = data.slice().sort((a,b) => {
      const as = (selections[a.language_code]?.size||0) > 0 ? 0 : 1;
      const bs = (selections[b.language_code]?.size||0) > 0 ? 0 : 1;
      return as - bs;
    });
  }

  filteredData = data;
  document.getElementById('filter-count').textContent = `${data.length} shown`;
  buildNav();

  if (filteredData.length > 0) {
    currentIdx = 0;
    showCard(0);
  } else {
    document.getElementById('card-container').innerHTML = '<p style="color:var(--muted);padding:40px;text-align:center;">No languages match the current filters.</p>';
  }
}

// ── Nav sidebar ───────────────────────────────────────────────────────────────
function buildNav() {
  let html = '';
  let lastCat = null;
  filteredData.forEach((row, i) => {
    if (row.category !== lastCat) {
      html += `<div class="nav-divider">${CAT_LABELS[row.category]||row.category}</div>`;
      lastCat = row.category;
    }
    const hasSel = selections[row.language_code]?.size > 0;
    const check = hasSel ? `<span class="nav-check">✓</span>` : '';
    html += `<div class="nav-item" id="nav-${i}" onclick="showCard(${i})" title="${escHtml(row.language_name)}">
      <span class="nav-lang">${escHtml(row.language_name)}</span>
      <span class="nav-code">${escHtml(row.language_code)}</span>
      <span class="nav-badge cat-${row.category}" style="font-size:9px;padding:1px 5px;border-radius:8px;">${row.n_unique_raw||''}</span>
      ${check}
    </div>`;
  });
  document.getElementById('nav-list').innerHTML = html;
}

// ── Card render ───────────────────────────────────────────────────────────────
function showCard(idx) {
  if (idx < 0 || idx >= filteredData.length) return;
  currentIdx = idx;

  // Update nav highlight
  document.querySelectorAll('.nav-item.active').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById(`nav-${idx}`);
  if (navEl) { navEl.classList.add('active'); navEl.scrollIntoView({block:'nearest'}); }

  // Update progress bar
  const pct = filteredData.length > 1 ? (idx / (filteredData.length-1)) * 100 : 100;
  document.getElementById('progress-fill').style.width = pct + '%';

  const row = filteredData[idx];
  const code = row.language_code;
  if (!selections[code]) selections[code] = new Set();
  const sel = selections[code];

  // ── Stat boxes
  const conf = parseFloat(row.mean_llm_confidence);
  const confPct = isNaN(conf) ? 0 : Math.round(conf * 100);
  const std = parseFloat(row.std_llm_confidence);
  const stdStr = isNaN(std) ? '—' : std.toFixed(2);
  const sim = parseFloat(row.mean_rationale_similarity);
  const simStr = isNaN(sim) ? '—' : sim.toFixed(3);
  const edist = row.max_edit_distance || '—';

  // ── Signals
  let signalHtml = '';
  const loanFound = row.loan_words_found === 'True' || row.loan_words_found === true;
  if (loanFound) signalHtml += `<span class="signal-pill loan">Loan word found</span>`;
  const hasScriptDisagr = row.has_script_disagreement === 'True' || row.has_script_disagreement === true;
  if (hasScriptDisagr) {
    let scriptsLabel = '';
    try { scriptsLabel = (String(row.scripts_found||'').match(/[A-Za-z]+/g)||[]).join(' + '); } catch(e){}
    signalHtml += `<span class="signal-pill script">Script disagreement${scriptsLabel ? ': '+scriptsLabel : ''}</span>`;
  }
  [[row.absence_signals,'absence'],[row.construction_signals,'construction'],[row.debate_signals,'debate']].forEach(([val,cls]) => {
    if (!val || val === 'nan' || val === 'None') return;
    String(val).split(';').map(s=>s.trim()).filter(Boolean).forEach(p => signalHtml += `<span class="signal-pill ${cls}">${escHtml(p)}</span>`);
  });

  // ── Script per service lookup
  const scriptPerService = {};
  try {
    String(row.script_signals||'').split(';').forEach(part => {
      const m = part.trim().match(/^(.+):(\w+)$/);
      if (m) scriptPerService[m[1].trim()] = m[2].trim();
    });
  } catch(e) {}

  // ── Build term clusters from all 25 matrix cells
  const { clusters, cellCluster } = buildClusters(row, code, sel);
  currentClusters[code] = clusters;

  // ── Cluster panel (replaces old translation candidates)
  const totalCells = RAT_SERVICES.length * VARIANTS.length;
  const selClusterCount = clusters.filter(c => c.selected).length;
  let clusterHtml = `<div class="cluster-panel">
    <div class="cluster-panel-header">

      <span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="selectTopNClusters('${code}',1)">Top 1</button>
        <button class="btn btn-ghost btn-sm" onclick="selectTopNClusters('${code}',2)">Top 2</button>
        <button class="btn btn-ghost btn-sm" onclick="selectTopNClusters('${code}',3)">Top 3</button>
        <button class="btn btn-ghost btn-sm" onclick="clearTerms('${code}')">Clear</button>
      </span>
    </div>`;
  clusters.forEach(cl => {
    const barW = Math.max(4, Math.round((cl.count / totalCells) * 120));
    clusterHtml += `<div class="cluster-row ${cl.selected?'selected':''}" id="clrow-${code}-${cl.id}"
      onclick="toggleCluster('${code}',${cl.id})"
      style="--cl-color:${cl.color.border};--cl-bg:${cl.color.bg};">
      <div class="cluster-swatch" style="background:${cl.color.border};"></div>
      <div class="cluster-term">${escHtml(cl.canonical)}</div>
      <div class="cluster-bar-wrap"><div class="cluster-bar" style="width:${barW}px;background:${cl.color.border};opacity:.7;"></div></div>
      <div class="cluster-count">${cl.count}/${totalCells}</div>
      <div class="cluster-check">${cl.selected ? '✓' : ''}</div>
    </div>`;
  });
  clusterHtml += '</div>';

  // ── Rationale matrix: variants × services, cells colored by cluster
  let ratHtml = '';
  {
    let thead = `<tr><th class="row-header">Variant</th>`;
    RAT_SERVICES.forEach(s => { thead += `<th>${s.label}</th>`; });
    thead += '</tr>';
    let tbody = '';
    VARIANTS.forEach(v => {
      tbody += `<tr><td class="row-header">${v.label}</td>`;
      RAT_SERVICES.forEach(s => {
        const termKey = `${s.key}_term_${v.key}`;
        const ratKey  = `${s.key}_rationale_${v.key}`;
        const term = ((row[termKey]||'').trim());
        const rat  = ((row[ratKey]||'').trim());
        const termOk = term && term !== 'nan' && term !== 'None';
        const ratOk  = rat  && rat  !== 'nan'  && rat  !== 'None';
        const cellKey = `${s.key}_${v.key}`;
        const cl = cellCluster[cellKey];
        const cellId = `rc-${code}-${v.key}-${s.key}`;
        if (termOk || ratOk) {
          const scriptTag = (hasScriptDisagr && scriptPerService[s.label])
            ? `<span class="script-tag">${scriptPerService[s.label]}</span>` : '';
          const clStyle = cl ? `--cell-color:${cl.color.border};--cell-bg:${cl.color.bg};border-top:2px solid ${cl.color.border}44;` : '';
          const clSelected = cl?.selected ? 'cluster-selected' : '';
          tbody += `<td><div class="rat-cell ${clSelected}" id="${cellId}" style="${clStyle}" onclick="toggleRatCell('${cellId}')">
            ${termOk ? `<div class="rat-term">${escHtml(term)}${scriptTag}</div>` : ''}
            ${ratOk  ? `<div class="rat-rationale rat-md">${marked.parse(rat)}</div>` : ''}
            <span class="rat-expand-hint">click to expand</span>
          </div></td>`;
        } else {
          tbody += `<td><div class="rat-cell empty">—</div></td>`;
        }
      });
      tbody += '</tr>';
    });
    if (tbody) {
      ratHtml = `<div class="rat-matrix-wrap"><table class="rat-matrix"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
    }
  }

  // ── Baseline terms (non-LLM, prompt-invariant services)
  const BASELINE_SERVICES = [
    { key: 'wikipedia_translated_term', label: 'Wikipedia' },
    { key: 'gt_term',                   label: 'Google Translate' },
    { key: 'lingvanex_translated_term', label: 'Lingvanex' },
    { key: 'enmt_translated_term',      label: 'EasyNMT' },
  ];
  let baselineHtml = '';
  BASELINE_SERVICES.forEach(svc => {
    const term = ((row[svc.key]||'').trim());
    const valid = term && term !== 'nan' && term !== 'None';
    baselineHtml += `<div class="baseline-card">
      <div class="baseline-svc">${svc.label}</div>
      <div class="baseline-term ${valid ? '' : 'baseline-empty'}">${valid ? escHtml(term) : '—'}</div>
    </div>`;
  });

  // ── Wikipedia marker
  const hasWiki = row.has_wikipedia === 'True' || row.has_wikipedia === true;

  // ── Build card
  const prevBtnStyle = idx === 0 ? 'opacity:.3;pointer-events:none' : '';
  const nextBtnStyle = idx === filteredData.length-1 ? 'opacity:.3;pointer-events:none' : '';

  const html = `
  <div class="card">
    <!-- Navigation -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-ghost btn-sm" onclick="showCard(${idx-1})" style="${prevBtnStyle}">← Prev</button>
        <span style="font-size:12px;color:var(--muted);">${idx+1} / ${filteredData.length}</span>
        <button class="btn btn-ghost btn-sm" onclick="showCard(${idx+1})" style="${nextBtnStyle}">Next →</button>
      </div>
      <div style="display:flex;gap:8px;">
        ${hasWiki ? `<span style="font-size:11px;background:#1a2a1a;border:1px solid #4ecb7133;color:#4ecb71;padding:3px 8px;border-radius:6px;">Has Wikipedia</span>` : ''}
        <span class="category-badge cat-${row.category}">${CAT_LABELS[row.category]||row.category}</span>
      </div>
    </div>

    <!-- Header -->
    <div class="card-header">
      <div>
        <div class="lang-title">${escHtml(row.language_name)} <span style="color:var(--muted);font-size:14px;font-weight:400">${escHtml(row.language_code)}</span></div>
        <div class="lang-meta">${escHtml(row.language_family||'')}${row.term_source ? ' · ' + escHtml(row.term_source) : ''}</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="card-section">
      <div class="section-label">Disagreement Metrics</div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="val">${row.n_unique_raw||'—'}</div>
          <div class="lbl">Unique translations</div>
        </div>
        <div class="stat-box">
          <div class="val">${row.n_unique_normalized||'—'}</div>
          <div class="lbl">After normalizing</div>
        </div>
        <div class="stat-box">
          <div class="val">${edist}</div>
          <div class="lbl">Max edit distance</div>
        </div>
        <div class="stat-box">
          <div class="val" style="color:${conf < 0.4 ? 'var(--TRANSMOGRIFICATION)' : conf < 0.7 ? 'var(--STRUCTURAL_ABSENCE)' : 'var(--PRODUCTIVE_DISAGREEMENT)'}">${isNaN(conf) ? '—' : confPct + '%'}</div>
          <div class="conf-bar-wrap"><div class="conf-bar" style="width:${confPct}%;background:${conf < 0.4 ? 'var(--TRANSMOGRIFICATION)' : conf < 0.7 ? 'var(--STRUCTURAL_ABSENCE)' : 'var(--PRODUCTIVE_DISAGREEMENT)'}"></div></div>
          <div class="lbl">Mean LLM confidence (±${stdStr})</div>
        </div>
        <div class="stat-box">
          <div class="val">${simStr}</div>
          <div class="lbl">Rationale similarity</div>
        </div>
        ${row.mean_rationale_length ? `<div class="stat-box"><div class="val">${Math.round(parseFloat(row.mean_rationale_length))}</div><div class="lbl">Mean rationale length</div></div>` : ''}
      </div>
    </div>

    <!-- Evidence -->
    ${row.evidence && row.evidence !== 'nan' ? `<div class="card-section">
      <div class="section-label">Evidence</div>
      <div class="evidence-text">${escHtml(row.evidence)}</div>
    </div>` : ''}

    <!-- Signals -->
    ${signalHtml ? `<div class="card-section">
      <div class="section-label">Signals</div>
      <div class="signal-pills">${signalHtml}</div>
    </div>` : ''}

    <!-- Term clusters + Rationale matrix -->
    <div class="card-section">
      ${clusterHtml}
    </div>
    <!-- Baseline terms -->
    <div class="card-section">
      <div class="section-label">Baseline Terms (non-LLM)</div>
      <div class="baseline-strip">${baselineHtml}</div>
    </div>

    ${ratHtml ? `<div class="card-section">
      <div class="section-label" style="margin-bottom:10px;">Rationales — Variants × Services <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11px;">(click cell to expand rationale · colored border = cluster)</span></div>
      ${ratHtml}
    </div>` : ''}

    <!-- Notes -->
    <div class="card-section">
      <div class="section-label">Notes</div>
      <textarea class="notes-textarea" id="notes-${code}" placeholder="Add your notes about this language's translation…" onchange="saveNote('${code}')">${escHtml(notes[code]||'')}</textarea>
    </div>

  </div>`;

  document.getElementById('card-container').innerHTML = html;
}

// ── Cluster palette (8 distinct colors readable on dark bg) ──────────────────
const CLUSTER_COLORS = [
  { border: '#e0006a', bg: '#fff0f5' }, // hot pink
  { border: '#0099bb', bg: '#e8f8fc' }, // deep cyan
  { border: '#8b00d4', bg: '#f5eeff' }, // electric purple
  { border: '#007a50', bg: '#edfaf4' }, // deep green
  { border: '#c07000', bg: '#fff8ee' }, // amber
  { border: '#6b30cc', bg: '#f3edff' }, // violet
  { border: '#cc0066', bg: '#fff0f8' }, // magenta
  { border: '#007a9e', bg: '#e8f5fa' }, // teal
];

// ── Normalization (Latin diacritics + case; Cyrillic/Arabic stay distinct) ───
function normalizeTerm(t) {
  if (!t || t === 'nan' || t === 'None') return '';
  return t.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '').replace(/\s+/g, ' ').trim();
}

// ── Build cluster model from all variant×service matrix cells ─────────────────
function buildClusters(row, code, sel) {
  const clusterMap = new Map(); // normKey → { cells, terms }
  RAT_SERVICES.forEach(s => {
    VARIANTS.forEach(v => {
      const term = ((row[`${s.key}_term_${v.key}`]||'').trim());
      if (!term || term === 'nan' || term === 'None') return;
      const nk = normalizeTerm(term);
      if (!clusterMap.has(nk)) clusterMap.set(nk, { cells: [], termFreq: {} });
      const c = clusterMap.get(nk);
      c.cells.push({ svc: s.label, svcKey: s.key, variant: v.label, variantKey: v.key, term });
      c.termFreq[term] = (c.termFreq[term] || 0) + 1;
    });
  });

  // Sort clusters: most cells first
  const sorted = [...clusterMap.entries()].sort((a,b) => b[1].cells.length - a[1].cells.length);

  const clusters = sorted.map(([normKey, data], i) => {
    // Pick most frequent surface form as canonical
    const canonical = Object.entries(data.termFreq).sort((a,b) => b[1]-a[1])[0][0];
    const color = CLUSTER_COLORS[Math.min(i, CLUSTER_COLORS.length - 1)];
    return { id: i, normKey, canonical, color, count: data.cells.length,
             cells: data.cells, selected: sel?.has(canonical) || false };
  });

  // Build fast lookup: "svcKey_variantKey" → cluster
  const cellCluster = {};
  clusters.forEach(cl => cl.cells.forEach(c => { cellCluster[`${c.svcKey}_${c.variantKey}`] = cl; }));

  return { clusters, cellCluster };
}

// ── Module-level cluster store (keyed by language_code) ──────────────────────
const currentClusters = {};

// ── Interactions ──────────────────────────────────────────────────────────────
function toggleRatCell(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('expanded');
}

function svcId(key) { return key.replace(/[^a-zA-Z0-9]/g,'_'); }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

function toggleCluster(code, clusterId) {
  const clusters = currentClusters[code];
  if (!clusters) return;
  const cl = clusters[clusterId];
  if (!cl) return;
  if (!selections[code]) selections[code] = new Set();
  const sel = selections[code];

  if (cl.selected) {
    sel.delete(cl.canonical);
    cl.selected = false;
  } else {
    sel.add(cl.canonical);
    cl.selected = true;
  }

  // Update cluster row UI
  const rowEl = document.getElementById(`clrow-${code}-${clusterId}`);
  if (rowEl) {
    rowEl.classList.toggle('selected', cl.selected);
    const checkEl = rowEl.querySelector('.cluster-check');
    if (checkEl) checkEl.textContent = cl.selected ? '✓' : '';
    const termEl = rowEl.querySelector('.cluster-term');
  }

  // Update header count
  const hdr = document.querySelector('.cluster-panel-header span:nth-child(2)');
  if (hdr) {
    const selCount = clusters.filter(c => c.selected).length;
    hdr.textContent = `${selCount} selected · click row to toggle · matrix cells colored to match`;
  }

  // Update matrix cells that belong to this cluster
  const row = filteredData[currentIdx];
  if (row) {
    cl.cells.forEach(c => {
      const cellEl = document.getElementById(`rc-${code}-${c.variantKey}-${c.svcKey}`);
      if (cellEl) cellEl.classList.toggle('cluster-selected', cl.selected);
    });
  }

  _updateNavCheck(code, sel);
  saveState(); updateSelStat();
}

function selectTopNClusters(code, n) {
  const clusters = currentClusters[code];
  if (!clusters) return;
  if (!selections[code]) selections[code] = new Set();
  // Clear current selections for this language
  clusters.forEach(cl => { selections[code].delete(cl.canonical); cl.selected = false; });
  // Select top N by frequency
  clusters.slice(0, n).forEach(cl => { selections[code].add(cl.canonical); cl.selected = true; });
  showCard(currentIdx);
  saveState(); updateSelStat();
}

function clearTerms(code) {
  if (currentClusters[code]) currentClusters[code].forEach(cl => { cl.selected = false; });
  selections[code] = new Set();
  showCard(currentIdx);
  saveState(); updateSelStat();
}

function saveNote(code) {
  const el = document.getElementById(`notes-${code}`);
  if (el) notes[code] = el.value;
  saveState();
}

function _updateNavCheck(code, sel) {
  const navEl = document.getElementById(`nav-${currentIdx}`);
  if (!navEl) return;
  const existing = navEl.querySelector('.nav-check');
  if (sel.size > 0 && !existing) navEl.insertAdjacentHTML('beforeend','<span class="nav-check">✓</span>');
  else if (sel.size === 0 && existing) existing.remove();
}

function selectTopN() {
  const n = parseInt(document.getElementById('topn-input').value) || 5;
  clearAll(true);
  let count = 0;
  for (const row of filteredData) {
    if (count >= n) break;
    const code = row.language_code;
    if (!selections[code]) selections[code] = new Set();
    // Build clusters for this row and pick the most-agreed canonical term
    const fakeSel = new Set();
    const { clusters } = buildClusters(row, code, fakeSel);
    if (clusters.length > 0) selections[code].add(clusters[0].canonical);
    count++;
  }
  buildNav(); showCard(currentIdx); saveState(); updateSelStat();
}

function clearAll(silent) {
  Object.keys(currentClusters).forEach(k => currentClusters[k].forEach(cl => { cl.selected = false; }));
  selections = {};
  if (!silent) { buildNav(); showCard(currentIdx); saveState(); updateSelStat(); }
}

// ── Export ────────────────────────────────────────────────────────────────────
function buildExportData() {
  const rows = [];
  for (const [code, termSet] of Object.entries(selections)) {
    if (!termSet || termSet.size === 0) continue;
    const row = allData.find(r => r.language_code === code);
    if (!row) continue;
    const clusters = currentClusters[code] || [];
    for (const term of termSet) {
      // Find which cluster this term belongs to for provenance
      const cl = clusters.find(c => c.canonical === term);
      const termSource = cl
        ? [...new Set(cl.cells.map(c => c.svc))].join('; ')
        : '';
      const agreementCount = cl ? cl.count : '';
      rows.push({
        language_code: code,
        language_name: row.language_name || '',
        language_family: row.language_family || '',
        term,
        term_source: termSource,
        cluster_agreement: agreementCount,
        category: row.category || '',
        has_script_disagreement: row.has_script_disagreement || '',
        mean_llm_confidence: row.mean_llm_confidence || '',
        n_unique_raw: row.n_unique_raw || '',
        has_wikipedia: row.has_wikipedia || '',
        notes: notes[code] || '',
      });
    }
  }
  return rows;
}

function openExportModal() {
  const rows = buildExportData();
  const langs = new Set(rows.map(r => r.language_code)).size;
  document.getElementById('export-count').textContent = langs;
  if (rows.length === 0) {
    document.getElementById('export-preview').textContent = 'No selections yet. Click translation cards to select terms.';
  } else {
    const header = Object.keys(rows[0]).join(',');
    const lines = rows.slice(0, 10).map(r => Object.values(r).map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
    document.getElementById('export-preview').textContent = [header, ...lines, rows.length > 10 ? `… (${rows.length - 10} more rows)` : ''].filter(Boolean).join('\n');
  }
  document.getElementById('export-overlay').classList.add('open');
}

function closeExportModal() {
  document.getElementById('export-overlay').classList.remove('open');
}

function downloadExport() {
  const rows = buildExportData();
  if (rows.length === 0) { alert('No terms selected.'); return; }
  const header = Object.keys(rows[0]).join(',');
  const lines = rows.map(r => Object.values(r).map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv = [header, ...lines].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'selected_terms_for_github_search.csv'; a.click();
  URL.revokeObjectURL(url);
  closeExportModal();
}

// Close modal on overlay click
document.getElementById('export-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeExportModal();
});

// ── Keyboard navigation ───────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); showCard(currentIdx+1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); showCard(currentIdx-1); }
});
</script>
</body>
