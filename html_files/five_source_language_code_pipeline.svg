<svg width="100%" viewBox="0 0 860 724" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Five-source language code pipeline</title>
<desc>Diagram showing how five registries — CLDR 48.2, the CLDR v45 supplement, Library of Congress ISO 639-2, Wikimedia, and CLDR's languageGroups family hierarchy — merge into a single 880-language table, with four interpretive moves applied: directionality assignment, retention of non-modern languages, retention of v45-dropped codes, and three-tier family assignment.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<style>
  svg { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
</style>

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<text x="40" y="34" style="fill:rgb(20,20,19);font-size:14px;font-weight:500;">Five-source language code pipeline</text>
<text x="40" y="54" style="fill:rgb(61,61,58);font-size:12px;">Each registry contributes a different metadata layer; the merged table preserves provenance.</text>

<!-- ── Source box 1 : CLDR 48.2 (cyan) ───────────────────────────────── -->
<rect x="40" y="84" width="120" height="104" rx="8" style="fill:rgb(215,243,250);stroke:rgb(0,164,196);stroke-width:0.75px;"/>
<text x="100" y="104" text-anchor="middle" dominant-baseline="central" style="fill:rgb(0,74,90);font-size:14px;font-weight:500;">CLDR 48.2</text>
<text x="100" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(0,130,160);font-size:12px;">Scripts, direction,</text>
<text x="100" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(0,130,160);font-size:12px;">modern-use flag</text>
<text x="100" y="168" text-anchor="middle" dominant-baseline="central" style="fill:rgb(0,74,90);font-size:14px;font-weight:500;">812 codes</text>

<!-- ── Source box 2 : CLDR v45 (cyan, dashed) ────────────────────────── -->
<rect x="172" y="84" width="120" height="104" rx="8" stroke-dasharray="4 3" style="fill:rgb(215,243,250);stroke:rgb(0,164,196);stroke-width:0.75px;stroke-dasharray:4px,3px;"/>
<text x="232" y="104" text-anchor="middle" dominant-baseline="central" style="fill:rgb(0,74,90);font-size:14px;font-weight:500;">CLDR v45</text>
<text x="232" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(0,130,160);font-size:12px;">Codes dropped</text>
<text x="232" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(0,130,160);font-size:12px;">between releases</text>
<text x="232" y="168" text-anchor="middle" dominant-baseline="central" style="fill:rgb(0,74,90);font-size:14px;font-weight:500;">23 codes</text>

<!-- ── Source box 3 : LOC ISO 639-2 (magenta) ────────────────────────── -->
<rect x="304" y="84" width="120" height="104" rx="8" style="fill:rgb(252,226,240);stroke:rgb(190,30,106);stroke-width:0.75px;"/>
<text x="364" y="104" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120,0,65);font-size:14px;font-weight:500;">LOC ISO 639-2</text>
<text x="364" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">Two- and three-</text>
<text x="364" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">letter code map</text>
<text x="364" y="168" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120,0,65);font-size:14px;font-weight:500;">416 codes</text>

<!-- ── Source box 4 : Wikimedia (purple) ─────────────────────────────── -->
<rect x="436" y="84" width="120" height="104" rx="8" style="fill:rgb(237,224,248);stroke:rgb(120,60,180);stroke-width:0.75px;"/>
<text x="496" y="104" text-anchor="middle" dominant-baseline="central" style="fill:rgb(65,28,110);font-size:14px;font-weight:500;">Wikimedia</text>
<text x="496" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120,60,180);font-size:12px;">Active Wikipedia</text>
<text x="496" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120,60,180);font-size:12px;">projects</text>
<text x="496" y="168" text-anchor="middle" dominant-baseline="central" style="fill:rgb(65,28,110);font-size:14px;font-weight:500;">269 codes</text>

<!-- ── Source box 5 : Family tree (coral) ────────────────────────────── -->
<rect x="568" y="84" width="108" height="104" rx="8" style="fill:rgb(254,236,224);stroke:rgb(196,72,40);stroke-width:0.75px;"/>
<text x="622" y="104" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120,40,16);font-size:14px;font-weight:500;">Family tree</text>
<text x="622" y="124" text-anchor="middle" dominant-baseline="central" style="fill:rgb(196,72,40);font-size:12px;">CLDR language</text>
<text x="622" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(196,72,40);font-size:12px;">groups</text>
<text x="622" y="168" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120,40,16);font-size:14px;font-weight:500;">113 groups</text>

<!-- ── Arrows (source boxes → merger) ────────────────────────────────── -->
<line x1="100" y1="188" x2="300" y2="246" marker-end="url(#arrow)" style="fill:none;stroke:rgb(115,114,108);stroke-width:1.5px;"/>
<line x1="232" y1="188" x2="330" y2="246" marker-end="url(#arrow)" style="fill:none;stroke:rgb(115,114,108);stroke-width:1.5px;"/>
<line x1="364" y1="188" x2="360" y2="246" marker-end="url(#arrow)" style="fill:none;stroke:rgb(115,114,108);stroke-width:1.5px;"/>
<line x1="496" y1="188" x2="390" y2="246" marker-end="url(#arrow)" style="fill:none;stroke:rgb(115,114,108);stroke-width:1.5px;"/>
<line x1="622" y1="188" x2="420" y2="246" marker-end="url(#arrow)" style="fill:none;stroke:rgb(115,114,108);stroke-width:1.5px;"/>

<!-- ── Merger box ─────────────────────────────────────────────────────── -->
<rect x="200" y="250" width="280" height="64" rx="8" style="fill:rgb(242,240,234);stroke:rgb(140,136,120);stroke-width:0.75px;"/>
<text x="340" y="274" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60,58,50);font-size:14px;font-weight:500;">880 unique language codes</text>
<text x="340" y="296" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120,116,104);font-size:12px;">language_codes_comprehensive.csv</text>

<!-- ── Section 1 : Source overlap ─────────────────────────────────────── -->
<text x="40" y="346" style="fill:rgb(61,61,58);font-size:12px;">Source overlap (codes attested in three registries)</text>
<line x1="40" y1="354" x2="820" y2="354" style="stroke:rgba(31,30,29,0.15);stroke-width:0.5px;"/>

<!-- stacked bar -->
<rect x="40" y="370" width="780" height="20" rx="4" style="fill:rgb(187,232,243);stroke:rgb(0,153,184);stroke-width:0.5px;"/>
<rect x="40" y="370" width="369" height="20" style="fill:rgb(90,184,216);"/>
<rect x="409" y="370" width="160" height="20" style="fill:rgb(152,88,200);"/>
<rect x="569" y="370" width="193" height="20" style="fill:rgb(204,53,120);"/>
<rect x="762" y="370" width="58" height="20" style="fill:rgb(128,128,112);"/>

<text x="225" y="384" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255,255,255);font-size:12px;">CLDR only · 416</text>
<text x="489" y="384" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255,255,255);font-size:12px;">CLDR + LOC · 181</text>
<text x="666" y="384" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255,255,255);font-size:12px;">All three · 218</text>
<text x="791" y="384" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255,255,255);font-size:12px;">Other · 65</text>
<text x="40" y="408" style="fill:rgb(61,61,58);font-size:12px;">Of 880 codes, 416 sit in CLDR alone and 218 are triangulated across CLDR, LOC, and Wikimedia.</text>

<!-- ── Section 2 : Interpretive moves ────────────────────────────────── -->
<text x="40" y="448" style="fill:rgb(61,61,58);font-size:12px;">Four interpretive moves applied to the merged set</text>
<line x1="40" y1="456" x2="820" y2="456" style="stroke:rgba(31,30,29,0.15);stroke-width:0.5px;"/>

<!-- Interpretive box 1 : Directionality (amber) -->
<rect x="40" y="472" width="186" height="232" rx="8" style="fill:rgb(255,242,218);stroke:rgb(192,128,0);stroke-width:0.75px;"/>
<text x="133" y="492" text-anchor="middle" dominant-baseline="central" style="fill:rgb(115,75,0);font-size:14px;font-weight:500;">Directionality</text>
<text x="56" y="516" dominant-baseline="central" style="fill:rgb(160,100,0);font-size:12px;">rtl/ltr derived from</text>
<text x="56" y="532" dominant-baseline="central" style="fill:rgb(160,100,0);font-size:12px;">CLDR primary script</text>
<text x="56" y="548" dominant-baseline="central" style="fill:rgb(160,100,0);font-size:12px;">(ISO 15924 RTL set).</text>
<text x="56" y="572" dominant-baseline="central" style="fill:rgb(160,100,0);font-size:12px;">Wikimedia fallback</text>
<text x="56" y="588" dominant-baseline="central" style="fill:rgb(160,100,0);font-size:12px;">for wiki-only codes</text>
<text x="56" y="604" dominant-baseline="central" style="fill:rgb(160,100,0);font-size:12px;">with no CLDR script</text>
<text x="56" y="620" dominant-baseline="central" style="fill:rgb(160,100,0);font-size:12px;">data.</text>

<!-- Interpretive box 2 : Non-modern (green) -->
<rect x="238" y="472" width="186" height="232" rx="8" style="fill:rgb(224,244,232);stroke:rgb(56,128,64);stroke-width:0.75px;"/>
<text x="331" y="492" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24,76,32);font-size:14px;font-weight:500;">Non-modern</text>
<text x="254" y="516" dominant-baseline="central" style="fill:rgb(56,128,64);font-size:12px;">25 languages CLDR 48</text>
<text x="254" y="532" dominant-baseline="central" style="fill:rgb(56,128,64);font-size:12px;">flags non-modern — all</text>
<text x="254" y="548" dominant-baseline="central" style="fill:rgb(56,128,64);font-size:12px;">with ancient primary</text>
<text x="254" y="564" dominant-baseline="central" style="fill:rgb(56,128,64);font-size:12px;">scripts.</text>
<text x="254" y="588" dominant-baseline="central" style="fill:rgb(56,128,64);font-size:12px;">Avestan, Akkadian,</text>
<text x="254" y="604" dominant-baseline="central" style="fill:rgb(56,128,64);font-size:12px;">Ancient Egyptian, Linear</text>
<text x="254" y="620" dominant-baseline="central" style="fill:rgb(56,128,64);font-size:12px;">A, Carian, Lycian, Old</text>
<text x="254" y="636" dominant-baseline="central" style="fill:rgb(56,128,64);font-size:12px;">Persian, Phoenician.</text>
<text x="254" y="660" dominant-baseline="central" style="fill:rgb(56,128,64);font-size:12px;">All retained — the flag</text>
<text x="254" y="676" dominant-baseline="central" style="fill:rgb(56,128,64);font-size:12px;">tracks script vitality,</text>
<text x="254" y="692" dominant-baseline="central" style="fill:rgb(56,128,64);font-size:12px;">not language vitality.</text>

<!-- Interpretive box 3 : v45 supplement (magenta) -->
<rect x="436" y="472" width="186" height="232" rx="8" style="fill:rgb(252,226,240);stroke:rgb(190,30,106);stroke-width:0.75px;"/>
<text x="529" y="492" text-anchor="middle" dominant-baseline="central" style="fill:rgb(120,0,65);font-size:14px;font-weight:500;">v45 supplement</text>
<text x="452" y="516" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">23 ISO 639-3 codes</text>
<text x="452" y="532" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">dropped between CLDR</text>
<text x="452" y="548" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">45 (Apr 2024) and CLDR</text>
<text x="452" y="564" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">48 (Oct 2025).</text>
<text x="452" y="588" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">7 Indigenous N.</text>
<text x="452" y="604" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">American languages,</text>
<text x="452" y="620" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">ASL, 3 Ojibwa varieties</text>
<text x="452" y="636" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">+ macrolanguages.</text>
<text x="452" y="660" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">CLDR's criterion is</text>
<text x="452" y="676" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">administrative; pipeline</text>
<text x="452" y="692" dominant-baseline="central" style="fill:rgb(190,30,106);font-size:12px;">retains all 23.</text>

<!-- Interpretive box 4 : Family assignment (purple) -->
<rect x="634" y="472" width="186" height="232" rx="8" style="fill:rgb(237,224,248);stroke:rgb(120,60,180);stroke-width:0.75px;"/>
<text x="727" y="492" text-anchor="middle" dominant-baseline="central" style="fill:rgb(65,28,110);font-size:14px;font-weight:500;">Family assignment</text>
<text x="650" y="516" dominant-baseline="central" style="fill:rgb(120,60,180);font-size:12px;">Three-tier lookup:</text>
<text x="650" y="540" dominant-baseline="central" style="fill:rgb(120,60,180);font-size:12px;">manual table (292)</text>
<text x="650" y="556" dominant-baseline="central" style="fill:rgb(120,60,180);font-size:12px;">JSON assessment (586)</text>
<text x="650" y="572" dominant-baseline="central" style="fill:rgb(120,60,180);font-size:12px;">ISO 639-5 direct (2)</text>
<text x="650" y="596" dominant-baseline="central" style="fill:rgb(120,60,180);font-size:12px;">All 880 codes covered.</text>
<text x="650" y="620" dominant-baseline="central" style="fill:rgb(120,60,180);font-size:12px;">Every rationale logged</text>
<text x="650" y="636" dominant-baseline="central" style="fill:rgb(120,60,180);font-size:12px;">alongside its assignment</text>
<text x="650" y="652" dominant-baseline="central" style="fill:rgb(120,60,180);font-size:12px;">— so collisions surface</text>
<text x="650" y="668" dominant-baseline="central" style="fill:rgb(120,60,180);font-size:12px;">as collisions, not as</text>
<text x="650" y="684" dominant-baseline="central" style="fill:rgb(120,60,180);font-size:12px;">silent errors.</text>

</svg>
